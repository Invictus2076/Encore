{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Admin login</h1>
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label><span>Admin ID</span><input name="adminid" inputmode="numeric" required autofocus></label>
    <label><span>Password</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn wide">Log in</button>
  </form>
</section>
{% endblock %}
